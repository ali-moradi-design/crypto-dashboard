# Nginx inside the container: serves the static build (dist). The host Nginx in front
# of it terminates TLS and compresses responses.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # the host's address in redirects is wrong behind a proxy; keep them relative
    absolute_redirect off;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed file names: a new build gets new names, so cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: every route (/en/BTC_USDT, /fa/ETH_USDT…) gets index.html,
    # which is always revalidated so a deploy shows up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

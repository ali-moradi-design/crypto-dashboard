# Included in every location: add_header in a location replaces the server's headers.
# The browser talks straight to Gate's public API (REST and WebSocket); nothing else.
# Inline styles stay allowed for the style attributes that the resizable panels and the
# chart set; scripts come only from this site (no inline script, see public/theme-init.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.gateio.ws wss://api.gateio.ws; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

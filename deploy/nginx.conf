# crypto-dashboard.ali-moradi-develop.com -> the web container on 127.0.0.1:3109.
# The container sets its own headers (CSP, HSTS, nosniff, cache) in nginx/. There
# is no database and nothing to submit, so Nginx only lets reads through.
#
# Install: /etc/nginx/sites-available/crypto-dashboard, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS block.

server {
    listen 80;
    listen [::]:80;
    server_name crypto-dashboard.ali-moradi-develop.com;

    server_tokens off;
    client_max_body_size 1k;      # nothing is ever uploaded here
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Only reading is possible: POST/PUT/DELETE… get 405 before reaching the container.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Hidden files (.git, .env…) are never served.
    location ~ /\. { deny all; }

    location / {
        proxy_pass http://127.0.0.1:3109;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
